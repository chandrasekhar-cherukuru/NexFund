spring.application.name=fundly

# =========================
# ? Server Configuration
# =========================
server.address=0.0.0.0
server.port=8080

# =========================
# ?? Database Configuration (AWS RDS)
# =========================
spring.datasource.url=jdbc:mysql://nexfund-db.crym4isoe4xt.ap-south-1.rds.amazonaws.com:3306/nexfund
spring.datasource.username=admin
spring.datasource.password=Chakri1124
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# ? JPA & Hibernate Settings
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# =========================
# ? CORS Configuration
# =========================
spring.web.cors.allowed-origins=https://www.nexfund.site
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# =========================
# ? Google OAuth2 Configuration
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
//spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.redirect-uri=https://www.nexfund.site/login/oauth2/code/google


# ? Frontend redirect URI (production + mobile)
app.oauth2.authorizedRedirectUri=https://www.nexfund.site/oauth2/redirect

# =========================
# ? Gmail SMTP Configuration
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# =========================
# ? Logging (Optional but useful)
# =========================
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=ERROR

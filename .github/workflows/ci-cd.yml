name: CI/CD Pipeline - NexFund

on:
  push:
    branches: [ main, feature-1.0 ]
  pull_request:
    branches: [ main, feature-1.0 ]

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fundly_test
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: maven

      - name: Wait for MySQL to be ready
        run: |
          sleep 10
          echo "MySQL service ready"

      - name: Run Unit Tests with JaCoCo
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/fundly_test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: testpass
        run: mvn clean test jacoco:report
        working-directory: NexFundBackend

      - name: Build Maven Package
        run: mvn clean package -DskipTests
        working-directory: NexFundBackend

      - name: Verify JAR Created
        run: |
          if [ -f NexFundBackend/target/fundly-0.0.1-SNAPSHOT.jar ]; then
            echo "✅ JAR built successfully"
          else
            echo "❌ JAR not found"
            exit 1
          fi

      - name: Verify JaCoCo Report
        run: |
          if [ -f NexFundBackend/target/jacoco/index.html ]; then
            echo "✅ JaCoCo coverage report generated"
          fi

      - name: Show backend files
        run: ls -la NexFundBackend

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
        env:
          AWS_REGION: ap-south-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Build Docker image for backend
        run: docker build -t nexfund-backend .
        working-directory: NexFundBackend

      - name: Tag Docker image for ECR
        run: docker tag nexfund-backend:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/nexfund-repo:latest

      - name: Push Docker image to ECR
        run: docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/nexfund-repo:latest

      - name: Check Test Results
        if: always()
        run: echo "✅ Backend build and test completed"

  frontend-deploy:
    runs-on: ubuntu-latest
    needs: test-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: npm ci
        working-directory: NexFundFrontend

      - name: Build frontend for production
        run: npm run build
        working-directory: NexFundFrontend

      - name: Deploy frontend to S3
        uses: jakejarvis/s3-sync-action@v0.5.1
        with:
          args: --acl public-read --delete
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
          SOURCE_DIR: NexFundFrontend/dist

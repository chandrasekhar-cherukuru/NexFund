name: CI/CD Pipeline - Fundly

on:
  push:
    branches: [ main, feature-1.0 ]
  pull_request:
    branches: [ main, feature-1.0 ]

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: fundly_test
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: maven

      - name: Wait for MySQL
        run: |
          sleep 10
          echo "MySQL service ready"

      - name: Run Unit Tests with JaCoCo
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/fundly_test
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: testpass
        run: mvn clean test jacoco:report
        working-directory: NexFundBackend

      - name: Build Maven Package
        run: mvn clean package -DskipTests
        working-directory: NexFundBackend

      - name: Verify JAR Created
        run: |
          if [ -f NexFundBackend/target/fundly-0.0.1-SNAPSHOT.jar ]; then
            echo "✅ JAR built successfully: fundly-0.0.1-SNAPSHOT.jar"
          else
            echo "❌ JAR not found"
            exit 1
          fi

      - name: Verify JaCoCo Report
        run: |
          if [ -f NexFundBackend/target/jacoco/index.html ]; then
            echo "✅ JaCoCo coverage report generated"
          fi

      - name: Check Test Results
        if: always()
        run: |
          echo "✅ All tests completed successfully"
